<script>
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
let selectedKey="";
let events=JSON.parse(localStorage.getItem("events")||"{}");

function generateCalendar(year){
const container=document.getElementById("calendar");
container.innerHTML="";
let today=new Date();

months.forEach((month,index)=>{
let firstDay=new Date(year,index,1).getDay();
let days=new Date(year,index+1,0).getDate();

let table=`<div class="month"><h2>${month}</h2><table>`;
table+=`<tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr><tr>`;

for(let i=0;i<firstDay;i++) table+="<td></td>";

for(let d=1;d<=days;d++){
let key=`${year}-${index}-${d}`;
let eventHtml="";

if(events[key]){
events[key].forEach(ev=>{
eventHtml+=`<span class='event-text'>• ${ev}</span>`;
});
}

let isToday=(d===today.getDate() && index===today.getMonth() && year===today.getFullYear());
let className=isToday?"today":"";

table+=`<td class="${className}" onclick="openPopup('${key}')">${d}${eventHtml}</td>`;

if((d+firstDay)%7===0) table+="</tr><tr>";
}

table+="</tr></table></div>";
container.innerHTML+=table;
});
}

function openPopup(key){
selectedKey=key;
var popup=document.getElementById("popup");
popup.style.display="block";
document.getElementById("overlay").style.display="block";
requestAnimationFrame(function(){ popup.classList.add("popup-open"); });

let list="";
if(events[key]){
events[key].forEach((ev,i)=>{
list+=`<div>${ev} <button onclick="removeOne(${i})">❌</button></div>`;
});
}

document.getElementById("eventList").innerHTML=list;
}

function closePopup(){
var popup=document.getElementById("popup");
popup.classList.remove("popup-open");
setTimeout(function(){ popup.style.display="none"; }, 220);
document.getElementById("overlay").style.display="none";
}

function addEvent(){
let text=document.getElementById("eventText").value;
if(text.trim()==="") return;

if(!events[selectedKey]) events[selectedKey]=[];
events[selectedKey].push(text);

localStorage.setItem("events",JSON.stringify(events));

document.getElementById("eventText").value="";
openPopup(selectedKey);
generateCalendar(2026);
}

function deleteEvents(){
delete events[selectedKey];
localStorage.setItem("events",JSON.stringify(events));
closePopup();
generateCalendar(2026);
}

function removeOne(index){
events[selectedKey].splice(index,1);
if(events[selectedKey].length===0) delete events[selectedKey];
localStorage.setItem("events",JSON.stringify(events));
openPopup(selectedKey);
generateCalendar(2026);
}

document.getElementById("overlay").onclick=closePopup;

window.onload=()=>{
generateCalendar(2026);
};
</script>


<script>
document.getElementById("icsExportBtn").addEventListener("click", function() {
  var events = JSON.parse(localStorage.getItem("events") || "{}");
  var lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Raigad Mix Boxing//Calendar//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH"
  ];
  Object.keys(events).forEach(function(key) {
    var parts = key.split("-");
    var year = parts[0];
    var month = String(parseInt(parts[1]) + 1).padStart(2, "0");
    var day = String(parts[2]).padStart(2, "0");
    var dateStr = year + month + day;
    (events[key] || []).forEach(function(ev) {
      lines.push("BEGIN:VEVENT");
      lines.push("DTSTART;VALUE=DATE:" + dateStr);
      lines.push("DTEND;VALUE=DATE:" + dateStr);
      lines.push("SUMMARY:" + ev.split(",").join("\,"));
      lines.push("END:VEVENT");
    });
  });
  lines.push("END:VCALENDAR");
  var blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rmba-calendar.ics";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
