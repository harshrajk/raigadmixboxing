<style>

/* BODY */

body{
margin:0;
font-family:var(--font-body);
background:radial-gradient(950px 420px at 84% 0%, rgba(255,0,0,0.22), transparent 72%), linear-gradient(135deg,#000000,#0b0b0b,#140000);
}

/* DARK OVERLAY */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(900px 360px at 84% 0%, rgba(220,38,38,0.2), transparent 72%),
rgba(0,0,0,0.68);
z-index:0;
}

/* PAGE HERO */

.media-hero{
text-align:center;
color:white;
padding:12px 12px 4px;
max-width:940px;
margin:0 auto;
}

.media-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:6px 12px;
border:1px solid rgba(255,255,255,0.18);
border-radius:999px;
background:rgba(255,255,255,0.06);
font-size:12px;
letter-spacing:.09em;
text-transform:uppercase;
}

.media-kicker img{
width:18px;
height:18px;
border-radius:50%;
}

.media-subtitle{
margin-top:10px;
font-size:15px;
line-height:1.6;
color:#d2dcec;
}

/* MAIN SECTION */

.main{
margin-top:18px;
text-align:center;
color:white;
padding-bottom:100px;
}

/* HEADING */

.main h1{
font-size:52px;
letter-spacing:2px;
line-height:1;
}

/* WHITE LINE */

.line{
width:min(230px,85%);
height:3px;
background:white;
margin:12px auto 26px auto;
}

/* PHOTO GRID */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
gap:16px;
justify-content:center;
max-width:1000px;
margin:0 auto;
}

/* IMAGE STYLE */

/* IMAGE CARD */
.gallery-item{
position:relative;
width:100%;
aspect-ratio:4/2;
overflow:hidden;
border-radius:12px;
background:#111;
border:1px solid rgba(255,215,0,0.3);
transition:0.4s;
box-shadow:0 10px 20px rgba(0,0,0,0.32);
}

/* IMAGE */
.gallery-item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:0.4s;
}

/* HOVER */
.gallery-item:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(255,215,0,0.6);
}

.gallery-item:hover img{
transform:scale(1.1);
}

.gallery-item video{
width:100%;
height:100%;
object-fit:cover;
display:block;
}


/* HOVER EFFECT */

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */

@media(max-width:800px){

.gallery{
grid-template-columns:repeat(2,minmax(140px, 1fr));
gap:12px;
}

.main h1{
font-size:36px;
}

}

@media(max-width:560px){
.gallery{grid-template-columns:1fr;}
}

</style>
